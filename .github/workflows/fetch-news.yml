name: Fetch News and Sentiment Data

on:
  schedule:
    # Runs 4 times a day (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests python-dateutil

      - name: Run news fetching script
        env:
          API_KEY_1: ${{ secrets.API_KEY_1 }}
          API_KEY_2: ${{ secrets.API_KEY_2 }}
          API_KEY_3: ${{ secrets.API_KEY_3 }}
          API_KEY_4: ${{ secrets.API_KEY_4 }}
          API_KEY_5: ${{ secrets.API_KEY_5 }}
          API_KEY_6: ${{ secrets.API_KEY_6 }}
          API_KEY_7: ${{ secrets.API_KEY_7 }}
        # Make sure your news script is named this, or update the name here
        run: python fetch_news_and_sentiment.py

      - name: Commit and push data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: Add historical news and sentiment data"
          # The * is a wildcard that matches any folder name
          file_pattern: "*_news_data/ news_state.json"
