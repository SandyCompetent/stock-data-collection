name: Fetch Historical Stock Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install pandas requests python-dateutil

      - name: Run data fetching script
        env:
          API_KEY_1: ${{ secrets.API_KEY_1 }}
#          API_KEY_2: ${{ secrets.API_KEY_2 }}
#          API_KEY_3: ${{ secrets.API_KEY_3 }}
#          API_KEY_4: ${{ secrets.API_KEY_4 }}
#          API_KEY_5: ${{ secrets.API_KEY_5 }}
        run: python fetch_stock_data.py

      - name: Commit and push data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: Add historical stock data for a new month"
          # Commit both the new CSVs and the state file
          file_pattern: "**/*.csv state.json"